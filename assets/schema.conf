# =============================================================================
# Labyrinth of the Dragon - Database Schema
# =============================================================================
#
# This file describes every table the game's build reads. It replaces the
# positional `tables.csv` format, where a column's meaning was implied by its
# position and its name suffix (`player_hp_c` meant "player_hp, C tier").
#
# Format
# ------
# Each table is declared as a [table:name] block:
#
#   [table:name]
#   key       = level          # the column used as the row key
#   rows      = 100            # expected row count (optional; validated)
#   source    = data/name.csv  # where the rows live
#
#   column    = name : type : description
#
# Types are C types: uint8_t, int8_t, uint16_t, int16_t, uint32_t.
# The build validates that every value fits its declared type.
#
# Tiered tables
# -------------
# Many tables come in four power tiers (C, B, A, S). Rather than repeating
# four columns per stat, a table may declare `tiers` and list its columns
# once. The generator then emits a [4][rows] array, and the data file carries
# one row per (level, tier) pair:
#
#   [table:player_hp]
#   key     = level
#   tiers   = c,b,a,s
#   source  = data/player_hp.csv
#   column  = hp : uint16_t : maximum hit points
#
#   # data/player_hp.csv
#   level,tier,hp
#   0,c,6
#   0,b,9
#   ...
#
# Generated output
# ----------------
# Flat table   -> const uint16_t name[rows];
# Tiered table -> const uint16_t name[4][rows];
#
# =============================================================================


# -----------------------------------------------------------------------------
# Progression
# -----------------------------------------------------------------------------

[table:exp_by_level]
key    = level
rows   = 100
source = data/exp_by_level.csv
column = level  : uint8_t  : character level, 0..99
column = exp_by_level : uint16_t : total experience required to reach this level


# -----------------------------------------------------------------------------
# Player statistics, by power tier
# -----------------------------------------------------------------------------

[table:player_hp]
key    = level
rows   = 100
tiers  = c,b,a,s
source = data/player_hp.csv
column = level : uint8_t  : character level
column = tier  : uint8_t  : power tier index (0=c, 1=b, 2=a, 3=s)
column = player_hp : uint16_t : maximum hit points

[table:player_sp]
